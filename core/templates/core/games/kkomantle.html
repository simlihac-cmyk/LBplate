{% extends 'core/base.html' %}
{% load static %}

{% block title %}꼬맨틀 - 의미를 찾는 게임{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'core/css/games/kkomantle.css' %}">
{% endblock %}

{% block content %}
<div class="game-container">
    <div class="header-box">
        <h1>🧩 꼬맨틀</h1>
        <p>오늘의 단어를 찾아보세요!</p>
        <small id="statusText" role="status" aria-live="polite">AI와 연결되었습니다.</small>
    </div>

    <div id="successArea" class="success-modal" aria-live="polite">
        <h2>🎉 정답입니다!</h2>
        <p><span id="finalCount">0</span>번 만에 맞추셨네요!</p>
        <button id="shareBtn" type="button" class="share-btn">
            📤 결과 복사하기
        </button>
    </div>

    <form id="guessForm" class="input-group">
        <label for="wordInput" class="sr-only">추측 단어 입력</label>
        <input type="text" id="wordInput" placeholder="단어를 입력하세요" autocomplete="off" required>
        <button id="submitBtn" type="submit">추측하기</button>
    </form>

    <div class="table-header">
        <span class="table-word-col">단어</span>
        <span class="table-score-col">유사도 / 순위</span>
    </div>

    <ul id="guessList" class="guess-list" aria-live="polite"></ul>
</div>
{% endblock %}

{% block extra_script %}
<script>
    const GAME_CONFIG = {
        apiUrl: "{% url 'api_kkomantle_guess' %}",
        csrfToken: "{{ csrf_token }}"
    };
</script>

<script src="{% static 'core/js/games/kkomantle.js' %}?v=2"></script>
{% endblock %}
